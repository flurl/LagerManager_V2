server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Docker's embedded DNS. Required so the proxy_pass targets below can be
    # re-resolved at request time: a bare hostname in proxy_pass is resolved
    # once at config load and cached for the life of the process, so every
    # `docker compose up -d backend` (which recreates the container with a new
    # IP) left nginx proxying to a dead address until it was restarted.
    #
    # 127.0.0.11 is fixed for containers on a user-defined network, which is
    # what compose creates. It would not hold under network_mode: host, the
    # legacy default bridge, or a non-Docker runtime; the symptom would be
    # "backend could not be resolved" in the error log.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Vue SPA — catch-all falls back to index.html for client-side routing
    location / {
        root /srv/frontend;
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached — prevents stale SPA from masking proxied routes after deploys
    location = /index.html {
        root /srv/frontend;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Django API
    location /api/ {
        # Via a variable so the name is resolved per request, not cached at
        # config load. No URI part, so the original request URI is passed
        # through unchanged — same as a literal proxy_pass without a path.
        set $api_backend http://backend:8000;
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 630s;  # slightly above gunicorn's 120s + buffer for POS sync
    }

    # Django admin
    location /admin/ {
        set $admin_backend http://backend:8000;
        proxy_pass $admin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Django-collected static files
    location /static/ {
        alias /srv/static/;
    }

    # User-uploaded media
    location /media/ {
        alias /srv/media/;
    }
}
